<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is applied natively from main.tsx only: on iOS it flips every
         env(safe-area-inset-*) from 0 to a real value, which would resize the web tab bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#24493c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ruminate" />
    <meta name="description" content="A calm, deliberate way to keep Scripture close." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/ruminate.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/ruminate.svg" />
    <title>Ruminate — Scripture Memory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
