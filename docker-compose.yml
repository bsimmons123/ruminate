services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: selah
      POSTGRES_USER: selah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selah_local_password}
    volumes:
      - selah_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selah -d selah"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://selah:${POSTGRES_PASSWORD:-selah_local_password}@db:5432/selah
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-public-deployment}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ESV_API_KEY: ${ESV_API_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      APNS_KEY_P8: ${APNS_KEY_P8:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-com.selah.scripturememory}
      APNS_SANDBOX: ${APNS_SANDBOX:-false}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  selah_postgres:
