name: Publish Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'bsimmons123/selah'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Sync production mobile app
        run: npm run mobile:sync:prod

      - name: Build and sign installable APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Android signing secret: $name" >&2
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/selah-release.jks"
          chmod 600 "$RUNNER_TEMP/selah-release.jks"
          (cd android && ./gradlew assembleRelease --no-daemon)

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/selah-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/selah-android.apk" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/selah-android.apk"
          (cd "$RUNNER_TEMP" && sha256sum selah-android.apk > selah-android.apk.sha256)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: bsimmons123/selah
        run: |
          set -euo pipefail
          tag="android-${GITHUB_SHA:0:12}"
          title="Selah Android ${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/selah-android.apk" "$RUNNER_TEMP/selah-android.apk.sha256" --clobber
          else
            gh release create "$tag" \
              "$RUNNER_TEMP/selah-android.apk" \
              "$RUNNER_TEMP/selah-android.apk.sha256" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes 'Installable Android APK configured for https://selah.simmonsweb.com. Requires the matching Selah backend API.'
          fi
