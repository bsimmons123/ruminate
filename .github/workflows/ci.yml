name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate bundled Bible text and lookup
        run: npm run test:bible

      - name: Validate app update logic
        run: npm run test:update

      - name: Build web application
        run: npm run build

      - name: Validate API syntax
        run: |
          node --check server/index.js
          node --check server/reminders.js

      - name: Install browser for offline regression checks
        run: npx playwright install --with-deps chromium

      - name: Verify offline account access and sync
        run: npm run test:offline

      - name: Sync native projects
        run: npx cap sync

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build container image
        run: docker build --tag ruminate:ci .
