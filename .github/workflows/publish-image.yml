name: Publish container image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }} natively
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ruminate

      - name: Build and publish architecture image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/ruminate,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=ruminate-${{ matrix.arch }}
          cache-to: type=gha,scope=ruminate-${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true

      - name: Check native Node runtime and dependencies
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ruminate
          DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}
        run: |
          docker run --rm --entrypoint node -e EXPECTED_ARCH "$IMAGE@$DIGEST" -e '
            require("node:assert/strict").equal(process.arch, process.env.EXPECTED_ARCH);
            for (const dependency of ["express", "pg", "jsonwebtoken", "bcryptjs", "firebase-admin"]) require(dependency);
            console.log("Native runtime and server dependencies loaded on " + process.arch);
          '

      - name: Export image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish combined architecture tags
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download architecture digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Publish latest and commit tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ruminate
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || { echo "Invalid image digest" >&2; exit 1; }
            sources+=("$IMAGE@sha256:$digest")
          done
          [[ ${#sources[@]} -eq 2 ]] || { echo "Both architecture images are required" >&2; exit 1; }
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-${GITHUB_SHA:0:7}" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA:0:7}" --raw > "$RUNNER_TEMP/ruminate-manifest.json"
          node -e '
            const index = require(process.argv[1]);
            const architectures = new Set(index.manifests.filter(item => item.platform?.os === "linux").map(item => item.platform.architecture));
            if (!architectures.has("amd64") || !architectures.has("arm64")) throw new Error("Published image must include AMD64 and ARM64");
            console.log("Published both AMD64 and ARM64 images.");
          ' "$RUNNER_TEMP/ruminate-manifest.json"
